  .footer { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }

 "01:00 - 02:00 PM": "", "02:00 - 03:00 PM": "PDS-C", "03:00 - 04:00 PM": ""}, "Sat": {"08:00 - 09:00 AM": "", "09:00 - 10:00 AM": "", "10:20 - 11:20 AM": "PDS-C", "11:20 - 12:20 PM": "PDS-B", "01:00 - 02:00 PM": "", "02:00 - 03:00 PM": "", "03:00 - 04:00 PM": ""}}}]};

const lecturerEl = document.getElementById("lecturer");
const dayEl = document.getElementById("day");
const slotEl = document.getElementById("slot");
const resultsEl = document.getElementById("results");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function occupied(value) {
  return String(value || "").trim() !== "";
}

function isClassEntry(value) {
  const s = String(value || "").trim().toLowerCase();
  if (!s) return false;
  if (["r","c","e","p"].includes(s)) return false;
  const nonClass = ["load","paper","patent","drc work","work","consultancy","admin"];
  return !nonClass.some(x => s.includes(x));
}

function classCount(staff, day) {
  const schedule = staff.schedule[day] || {};
  return DATA.slots.reduce((n, slot) => n + (isClassEntry(schedule[slot]) ? 1 : 0), 0);
}

function occupiedSlots(staff, day) {
  const schedule = staff.schedule[day] || {};
  return DATA.slots.filter(slot => occupied(schedule[slot]));
}

function freeSlots(staff, day) {
  const schedule = staff.schedule[day] || {};
  return DATA.slots.filter(slot => !occupied(schedule[slot]));
}

function fillSelects() {
  DATA.staff.forEach((s, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = s.name;
    lecturerEl.appendChild(o);
  });
  DATA.days.forEach(d => {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    dayEl.appendChild(o);
  });
  const all = document.createElement("option");
  all.value = "ALL"; all.textContent = "All Day";
  slotEl.appendChild(all);
  DATA.slots.forEach(s => {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    slotEl.appendChild(o);
  });
}

function scheduleRows(staff, day, onlySlot=null) {
  const schedule = staff.schedule[day] || {};
  const slots = onlySlot ? [onlySlot] : DATA.slots;
  return slots.filter(s => occupied(schedule[s])).map(s =>
    `<tr><td>${esc(s)}</td><td>${esc(schedule[s])}</td></tr>`
  ).join("");
}

function findBackup() {
  const selected = DATA.staff[Number(lecturerEl.value)];
  const day = dayEl.value;
  const requested = slotEl.value;
  const selectedSchedule = selected.schedule[day] || {};

  let targetSlots;
  if (requested === "ALL") {
    targetSlots = DATA.slots.filter(s => occupied(selectedSchedule[s]));
  } else {
    targetSlots = [requested];
  }

  let scheduleHtml = "";
  if (requested === "ALL") {
    const rows = scheduleRows(selected, day);
    scheduleHtml = rows
      ? `<table><thead><tr><th>Time Slot</th><th>Your Class / Schedule</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">No scheduled entry found for ${esc(selected.name)} on ${esc(day)}.</div>`;
  } else {
    const val = selectedSchedule[requested] || "";
    scheduleHtml = val
      ? `<table><thead><tr><th>Time Slot</th><th>Your Class / Schedule</th></tr></thead><tbody><tr><td>${esc(requested)}</td><td>${esc(val)}</td></tr></tbody></table>`
      : `<div class="notice">There is no scheduled class/entry for ${esc(selected.name)} at <b>${esc(requested)}</b> on ${esc(day)}.</div>`;
  }

  const candidates = DATA.staff
    .filter(s => s.name !== selected.name)
    .map(s => {
      const schedule = s.schedule[day] || {};
      const free = targetSlots.filter(slot => !occupied(schedule[slot]));
      return { s, free, count: classCount(s, day) };
    })
    .filter(x => x.free.length > 0)
    .sort((a,b) => a.count - b.count || a.s.name.localeCompare(b.s.name));

  let backupRows = candidates.map(x => {
    const freeText = x.free.join("<br>");
    return `<tr>
      <td><b>${esc(x.s.name)}</b></td>
      <td><span class="pill">${freeText}</span></td>
      <td>${x.count}</td>
    </tr>`;
  }).join("");

  const candidateIntro = requested === "ALL"
    ? "Staff below are free in at least one of your scheduled slots on this day."
    : `Staff below have no scheduled entry at <b>${esc(requested)}</b> on ${esc(day)}.`;

  resultsEl.innerHTML = `
    <div class="card">
      <h2 class="title">i) Your schedule on ${esc(day)}</h2>
      <p class="sub"><b>${esc(selected.name)}</b></p>
      ${scheduleHtml}
    </div>

    <div class="card">
      <h2 class="title">ii) The following staff can back you up</h2>
      <p class="sub">${candidateIntro}</p>
      ${backupRows ? `
      <table>
        <thead>
          <tr>
            <th>Staff Name</th>
            <th>${requested === "ALL" ? "Available Backup Slot(s)" : "Available Slot"}</th>
            <th>Classes That Day</th>
          </tr>
        </thead>
        <tbody>${backupRows}</tbody>
      </table>` : `
      <div class="notice">No suitable backup staff were found from the timetable for the selected day/time.</div>`}
      <p class="small">An occupied timetable entry is treated as unavailable, including teaching, load, paper/patent, research/work or other entries shown in the source timetable.</p>
    </div>`;
}

fillSelects();
document.getElementById("findBtn").addEventListener("click", findBackup);
</script>
